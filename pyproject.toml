[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cn627-rcwa"
version = "0.1.0"
description = "Lightweight 1D-RCWA validator (TE, normal incidence). TMM cross-verified. Pure NumPy. | 轻量级一维 RCWA 验证器（TE/正入射）。TMM 交叉验证。纯 NumPy。"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.20"]
keywords = ["RCWA", "optics", "diffraction", "grating", "photonics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/CN-627-Cyborg-Lab/cn627-rcwa"

[tool.hatch.build.targets.wheel]
packages = ["src/cn627"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88